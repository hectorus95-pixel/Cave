<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b2333"><title>Ma Cave à Vin</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#211b1d;background:#f6f2ef}
*{box-sizing:border-box} body{margin:0} header{background:#5b2333;color:white;padding:18px 16px 14px;position:sticky;top:0;z-index:2}
h1{font-size:22px;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#ffffff18;border-radius:12px;padding:8px}.stat b{display:block;font-size:18px}.stat span{font-size:11px}
main{padding:14px;max-width:760px;margin:auto}.search{width:100%;padding:13px;border:1px solid #cfc4c7;border-radius:12px;font-size:16px;background:white}
.tabs{display:flex;gap:7px;margin:12px 0}.tab{flex:1;padding:10px;border:1px solid #cdbfc3;border-radius:10px;background:white}.tab.active{background:#5b2333;color:white}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.slot{min-height:76px;border:1px solid #d4c9cc;border-radius:10px;padding:6px 4px;background:white;text-align:left;overflow:hidden}.slot.full{border-top:4px solid #5b2333}.slot.empty{opacity:.62}.slot.dim{opacity:.16}.pos{font-size:10px;color:#766a6e;display:block}.name{font-size:11px;font-weight:650;display:block;margin-top:4px;line-height:1.15}.year{font-size:10px;color:#766a6e}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.actions button,.filelabel{border:1px solid #cdbfc3;background:white;border-radius:10px;padding:11px;text-align:center;font-size:14px}.filelabel input{display:none}
dialog{border:0;border-radius:16px;width:min(92vw,520px);padding:0;box-shadow:0 20px 70px #0005}dialog::backdrop{background:#0007}.dlg{padding:18px}.dlg h2{margin:0}.where{color:#766a6e;margin:3px 0 14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px}.form label.wide{grid-column:1/-1}.form input,.form select{width:100%;font:inherit;padding:10px;border:1px solid #cdbfc3;border-radius:9px;background:white;margin-top:4px}.dlgactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.dlgactions button{padding:11px 14px;border:0;border-radius:10px}.primary{background:#5b2333;color:white}.danger{background:#eee4e6;color:#6c1f2d}.secondary{background:#eee}
.note{font-size:12px;color:#766a6e;text-align:center;margin:12px 0 24px}
</style></head><body>
<header><h1>🍷 Ma Cave à Vin</h1><div class="stats">
<div class="stat"><b id="count">—</b><span>contenants</span></div>
<div class="stat"><b id="free">—</b><span>places libres</span></div>
<div class="stat"><b id="value">—</b><span>valeur</span></div>
</div></header>
<main>
<input id="search" class="search" placeholder="Rechercher un vin, domaine, millésime…">
<div class="tabs"><button class="tab active" data-c="1">Casier 1</button><button class="tab" data-c="2">Casier 2</button><button class="tab" data-c="3">Casier 3</button></div>
<div id="grid" aria-live="polite"></div>
<div class="actions"><button id="export">Sauvegarder</button><label class="filelabel">Restaurer<input id="import" type="file" accept="application/json"></label><button id="reset">Inventaire initial</button></div>
<p class="note">Les modifications sont enregistrées sur ce téléphone. Fais régulièrement une sauvegarde.</p>
</main>
<dialog id="dialog"><div class="dlg">
<h2 id="dialogTitle"></h2><p class="where" id="where"></p>
<div class="form">
<label class="wide">Vin / Cuvée<input id="f_vin"></label>
<label class="wide">Domaine<input id="f_domaine"></label>
<label>Millésime<input id="f_millesime" inputmode="numeric"></label>
<label>Couleur<select id="f_couleur"><option value=""></option><option>Rouge</option><option>Blanc</option><option>Rosé</option><option>Effervescent</option></select></label>
<label>Format<input id="f_format" placeholder="75 cl"></label>
<label>Prix (€)<input id="f_prix" inputmode="decimal"></label>
</div>
<div class="dlgactions"><button id="save" class="primary">Enregistrer</button><button id="remove" class="danger">Sortir la bouteille</button><button id="cancel" class="secondary">Annuler</button></div>
</div></dialog>
<script src="app.js"></script></body></html>
