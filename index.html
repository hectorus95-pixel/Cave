<!doctype html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#4b0d1b"><title>Ma Cave à Vin</title><link rel=manifest href=manifest.webmanifest>
<style>
:root{font-family:system-ui,sans-serif;background:#171313;color:#fff}*{box-sizing:border-box}body{margin:0;background:#171313}header{background:#4b0d1b;padding:18px 16px;position:sticky;top:0;z-index:2}h1{margin:0 0 12px;font-size:23px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat b{font-size:20px;display:block}.stat span{font-size:12px}main{padding:14px;max-width:760px;margin:auto}.search{width:100%;padding:13px;border-radius:12px;border:1px solid #777;background:#2b2929;color:white;font-size:16px}.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;padding:11px;border:0;border-radius:11px;background:#555;color:white}.tab.active{background:#6d1930}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.slot{min-height:82px;border:0;border-top:6px solid #777;border-radius:11px;padding:6px;text-align:left;color:white}.slot.red{background:#641f31}.slot.white{background:#b08b31;color:#18130a}.slot.rose{background:#b55c6d}.slot.spark{background:#86722b}.slot.empty{background:#3a3737;color:#aaa}.slot.age1{border-top-color:#58a85b}.slot.age2{border-top-color:#a7b64c}.slot.age3{border-top-color:#d5a43c}.slot.age4{border-top-color:#c96c35}.slot.age5{border-top-color:#8c3542}.pos,.year{font-size:11px;opacity:.75;display:block}.name{font-size:12px;font-weight:700;display:block;margin:5px 0}.dim{opacity:.15}.actions{display:flex;gap:8px;margin:16px 0}.actions button,.filelabel{background:#333;color:white;border:1px solid #666;border-radius:10px;padding:11px;flex:1;text-align:center}.filelabel input{display:none}
dialog{width:min(92vw,520px);border:0;border-radius:16px;background:#262222;color:white}dialog::backdrop{background:#0009}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.form input,.form select,#pick{width:100%;padding:10px;margin-top:4px;border-radius:8px;border:1px solid #777;background:#333;color:white}.dlgactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.dlgactions button{padding:11px;border:0;border-radius:9px}.primary{background:#7b1e37;color:white}.danger{background:#733;color:white}.secondary{background:#555;color:white}.where{opacity:.7}
</style></head><body><header><h1>🍷 Ma Cave à Vin</h1><div class=stats><div class=stat><b id=count></b><span>contenants</span></div><div class=stat><b id=free></b><span>places libres</span></div><div class=stat><b id=value></b><span>valeur</span></div></div></header><main><input id=search class=search placeholder="Rechercher un vin, domaine, millésime…"><div class=tabs><button class="tab active" data-c=1>Casier 1</button><button class=tab data-c=2>Casier 2</button><button class=tab data-c=3>Casier 3</button></div><div id=grid></div><div class=actions><button id=export>Sauvegarder</button><label class=filelabel>Restaurer<input id=import type=file></label></div></main>
<dialog id=addDialog><h2>Ajouter une bouteille</h2><p>Choisis un vin existant ou crée une nouvelle référence.</p><select id=pick></select><div class=dlgactions><button id=useRef class=primary>Ajouter depuis ma base</button><button id=newRef class=primary>Créer un nouveau vin</button><button id=cancelAdd class=secondary>Annuler</button></div></dialog>
<dialog id=dialog><h2 id=dialogTitle></h2><p id=where class=where></p><div class=form><label class=wide>Vin / Cuvée<input id=f_vin></label><label class=wide>Domaine<input id=f_domaine></label><label>Millésime<input id=f_millesime></label><label>Couleur<select id=f_couleur><option>Rouge</option><option>Blanc</option><option>Rosé</option><option>Effervescent</option></select></label><label>Format<input id=f_format></label><label>Prix (€)<input id=f_prix></label></div><div class=dlgactions><button id=save class=primary>Enregistrer la référence</button><button id=remove class=danger>Sortir cette bouteille</button><button id=cancel class=secondary>Annuler</button></div></dialog><script src=app.js></script></body></html>
